[package]
name = "horizon-hud-gpui"
version = "0.1.5"
edition = "2024"

[dependencies]
gpui = "0.2.2"
gpui-component = "0.5.1"
rust-embed = "8"
webbrowser = "1.2.4"
confy = "2"
serde = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"
tray-icon = "0.24"
image = { version = "0.25", default-features = false, features = ["png"] }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }
